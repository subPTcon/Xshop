server:
  port: 8085

spring:
  application:
    name: order-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      password: redis123456

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      id-type: auto

logging:
  level:
    org.michael.order: debug