server:
  port: 8088

spring:
  application:
    name: notification-service

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/notification_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      password: redis123456

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "org.michael.notification.event"
        spring.json.type.mapping: "orderCreated:org.michael.notification.event.OrderCreatedEvent,orderCancelled:org.michael.notification.event.OrderCancelledEvent,paymentSuccess:org.michael.notification.event.PaymentSuccessEvent,logisticsStatusChanged:org.michael.notification.event.LogisticsStatusChangedEvent"
        

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      id-type: auto

logging:
  level:
    org.michael.order: debug